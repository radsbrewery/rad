<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#7EC8F5; --sky2:#C9EBFC; --stone:#80858E; --stone-d:#5E636B;
  --ink:#172033; --ink-soft:#3A4560; --panel:#FFFDF6; --panel-d:#D6CFBA; --edge:#172033;
  --p1:#D9403A; --p1-soft:#FFE1DD; --p2:#8A5CE0; --p2-soft:#ECE3FF;
  --p3:#E0A416; --p3-soft:#FFF1C7; --p4:#2F7FD8; --p4-soft:#DDEBFF;
  --good:#23994A; --bad:#D23A28; --lucky:#1FC8D0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#141B38; --sky2:#27315E; --stone:#4F535B; --stone-d:#383B41;
  --ink:#F4F6FB; --ink-soft:#CDD5E6; --panel:#262B42; --panel-d:#141726; --edge:#05070E;
  --p1-soft:#52262C; --p2-soft:#3B2E66; --p3-soft:#54441A; --p4-soft:#1E3556;}}
:root[data-theme="dark"]{
  --sky:#141B38; --sky2:#27315E; --stone:#4F535B; --stone-d:#383B41;
  --ink:#F4F6FB; --ink-soft:#CDD5E6; --panel:#262B42; --panel-d:#141726; --edge:#05070E;
  --p1-soft:#52262C; --p2-soft:#3B2E66; --p3-soft:#54441A; --p4-soft:#1E3556;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:500;font-size:17px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--ink);
  background:linear-gradient(var(--sky) 0 55%,var(--sky2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible,input:focus-visible{outline:4px solid var(--lucky);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:14px;position:relative;z-index:1}
.hidden{display:none!important}
.cloud{position:fixed;z-index:0;pointer-events:none;width:24px;height:24px;background:#fff;opacity:.85;
  box-shadow:24px 0 #fff,48px 0 #fff,24px -24px #fff,48px -24px #fff,72px 0 #fff,96px 0 #fff,72px -24px #fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cloud{opacity:.08}}
:root[data-theme="dark"] .cloud{opacity:.08}
.px{background:var(--panel);border:4px solid var(--edge);box-shadow:inset -5px -5px 0 var(--panel-d),6px 6px 0 rgba(0,0,0,.25)}
.pbtn{border:4px solid var(--edge);background:var(--bg,var(--panel));color:var(--fg,var(--ink));font-weight:700;
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.2),inset 5px 5px 0 rgba(255,255,255,.3)}
.pbtn:active{box-shadow:inset 5px 5px 0 rgba(0,0,0,.25);transform:translateY(2px)}

/* setup */
.title{text-align:center;margin:6px 0 0}
.title h1{font-family:"Pixelify Sans","Nunito",sans-serif;font-size:clamp(2.8rem,10vw,5.2rem);line-height:1.05;margin:0;font-weight:700;color:#fff;
  text-shadow:0 5px 0 var(--edge),5px 0 0 var(--edge),-5px 0 0 var(--edge),0 -5px 0 var(--edge),5px 5px 0 var(--edge),-5px 5px 0 var(--edge),5px -5px 0 var(--edge),-5px -5px 0 var(--edge),9px 11px 0 rgba(0,0,0,.25)}
.title p{font-size:1.2rem;margin:14px auto;max-width:34em;line-height:1.4;font-weight:600}
.settings{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px}
.settings button{font-size:1.05rem;padding:6px 12px}
.settings button[aria-pressed="true"]{--bg:var(--ink);--fg:var(--panel)}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.count button{font-size:1.2rem;padding:8px 16px}
.count button[aria-pressed="true"]{--bg:var(--good);--fg:#fff}
.players{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px}
.players[data-n="1"]{grid-template-columns:minmax(0,520px);justify-content:center}
.players[data-n="4"]{grid-template-columns:repeat(2,1fr)}
@media (max-width:860px){.players,.players[data-n="4"]{grid-template-columns:1fr}}
.pcard{padding:14px;border-top:12px solid var(--pc)}
.pcard .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pcard .head svg{width:38px;height:49px;flex:none}
.pcard label{display:block;font-weight:700;font-size:1.1rem;margin-bottom:4px}
.wins{font-size:1rem;color:var(--ink-soft);margin-top:3px;min-height:1.2em}
.pcard input{width:100%;font:inherit;font-size:1.3rem;font-weight:600;padding:6px 10px;border:4px solid var(--edge);background:#fff;color:#172033;border-radius:0}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lvl{font-size:1.2rem;padding:4px 0;--bg:var(--sky2)}
.lvl.wide{grid-column:span 2;font-size:1rem}
.lvl[aria-pressed="true"]{--bg:var(--pc);--fg:#fff}
.preview{margin-top:10px;font-size:1.05rem;min-height:2.8em;line-height:1.35}
.start{display:block;margin:20px auto 30px;font-size:1.9rem;padding:10px 44px;--bg:var(--good);--fg:#fff}

/* game */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.topbar .grp2{display:flex;gap:6px}
.turn{font-size:clamp(1.15rem,4vw,1.7rem);font-weight:700;padding:4px 16px;border-top:8px solid var(--pc);text-align:center}
.icon{font-size:1.1rem;padding:5px 10px}
.field{position:relative;display:grid;grid-template-columns:auto repeat(var(--n),minmax(0,1fr));align-items:end;gap:8px;padding:0 4px;max-width:calc(140px + var(--n) * 170px);margin:0 auto}
.field::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-26px;height:30px;z-index:0;
  background:linear-gradient(90deg,transparent 0 46px,var(--stone-d) 46px 50px) 0 0/50px 15px,
    linear-gradient(90deg,transparent 0 21px,var(--stone-d) 21px 25px) 0 15px/50px 15px,
    linear-gradient(transparent 0 11px,var(--stone-d) 11px 15px) 0 0/100% 15px,var(--stone);
  background-repeat:repeat-x;border-top:4px solid var(--edge)}
.tcol{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;transition:opacity .3s;min-width:0}
.tcol.idle{opacity:.5}
.pname{font-weight:700;font-size:clamp(.95rem,3vw,1.2rem);text-align:center;line-height:1.15;background:var(--pc);color:#fff;
  padding:3px 8px;border:3px solid var(--edge);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-weight:600;font-size:.95rem;margin-top:3px;text-align:center;line-height:1.2}
.tower{--h:clamp(200px,38vh,390px);height:var(--h);width:min(120px,100%);margin-top:62px;display:flex;flex-direction:column-reverse;gap:3px;position:relative}
.block{flex:1;border:2px dashed rgba(0,0,0,.18);position:relative}
.block.on{border:3px solid var(--edge);background-image:var(--tex);background-size:auto 100%;background-repeat:repeat-x;image-rendering:pixelated;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.3)}
.block.drop{animation:drop .45s steps(6)}
@keyframes drop{from{transform:translateY(-90px)}to{transform:none}}
.miner{position:absolute;left:50%;width:40px;height:52px;margin-left:-20px;z-index:3;bottom:calc((var(--h) + 3px) * var(--s) / 8);transition:bottom .35s steps(4)}
.miner svg{width:100%;height:100%;display:block}
.miner.hop svg{animation:hop .45s steps(4)}
@keyframes hop{50%{transform:translateY(-18px)}}
.crown{position:absolute;left:50%;transform:translateX(-50%);top:-30px;font-size:1.7rem;display:none}
.won .crown{display:block}
.ruler{height:clamp(200px,38vh,390px);display:flex;flex-direction:column-reverse;gap:3px;position:relative;z-index:1;align-self:end}
.ruler div{flex:1;display:flex;align-items:center;justify-content:center;min-width:26px;font-weight:700;font-size:.95rem}
.qcard{margin-top:44px;padding:14px;text-align:center;border-top:12px solid var(--pc)}
.qcard.lucky{border-color:var(--lucky);animation:glow .8s steps(2) infinite}
@keyframes glow{50%{border-color:#fff}}
.badge{display:inline-block;background:var(--lucky);color:#06262A;font-weight:700;font-size:1.05rem;padding:2px 12px;border:3px solid var(--edge);margin-bottom:6px}
.badge:empty{display:none}
.qlabel{font-weight:600;font-size:clamp(1.15rem,3.4vw,1.45rem);line-height:1.35;max-width:40em;margin:0 auto}
.eq{font-size:clamp(2.1rem,7.5vw,3.5rem);font-weight:600;line-height:1.3;margin:8px 0 12px;overflow-x:auto;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.25em .45em}
.eq sup,.ans sup{font-size:.55em}.eq sub,.ans sub{font-size:.55em}
.eq .sm{font-size:.62em}
.col{display:flex;flex-direction:column;align-items:center;gap:.15em}
.grp{line-height:1.15;letter-spacing:.04em;max-width:100%}
.basket{border:4px solid var(--edge);padding:2px 8px;background:var(--sky2);font-size:.72em}
.ill{width:auto;height:clamp(110px,22vw,170px);max-width:100%}
.ill.die{height:clamp(76px,15vw,104px)}
.ans .ill{height:64px}
.ans.clk .ill{height:96px}
.ill.big{height:clamp(190px,34vw,260px)}
.ill text{font-family:"Nunito",sans-serif;font-weight:700}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.85em}
.fr span+span{border-top:.07em solid currentColor;padding-top:.04em;min-width:1.2em}
.mat{display:inline-grid;gap:0 .6em;padding:0 .35em;border-left:.08em solid currentColor;border-right:.08em solid currentColor;font-size:.75em;text-align:center}
.binom{display:inline-flex;flex-direction:column;line-height:1;font-size:.8em;padding:0 .3em;border-left:.07em solid;border-right:.07em solid;border-radius:.4em}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.62em}
.prow{display:flex;gap:4px}
.brick{min-width:2.2em;padding:.1em .3em;border:3px solid var(--edge);background:#E9A77B;color:#172033;text-align:center}
.brick.e{background:#F6D9C3;color:transparent}.brick.q{background:var(--lucky)}
.grid3{display:grid;grid-template-columns:repeat(3,1.9em);font-size:.66em}
.grid3 span{border:3px solid var(--edge);text-align:center;background:var(--panel)}
.grid3 span.q{background:var(--lucky);color:#06262A}
.answers{display:grid;gap:10px;grid-template-columns:repeat(var(--k),1fr)}
@media (max-width:560px){.answers{grid-template-columns:repeat(2,1fr)}}
.ans{--bg:var(--pc-soft);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;padding:8px 6px;line-height:1.2;min-height:72px}
.ans.pic{font-size:clamp(1.3rem,4.2vw,1.9rem)}
.ans.txt{font-size:clamp(1.15rem,3.6vw,1.5rem)}
.ans:hover{filter:brightness(1.05)}
.ans.right{--bg:var(--good);--fg:#fff}
.ans.wrong{--bg:var(--bad);--fg:#fff;animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.feedback{min-height:1.5em;font-weight:700;font-size:1.3rem;margin-top:10px}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,30,.6);z-index:20}
.winbox,.flashbox{padding:22px 20px;text-align:center;max-width:480px;width:100%;border-top:14px solid var(--pc);animation:pop .4s steps(4)}
@keyframes pop{from{transform:scale(.5)}}
.winbox .avatars{display:flex;justify-content:center;gap:10px}
.winbox .avatars svg{width:56px;height:73px}
.winbox h2,.flashbox h2{font-size:2.1rem;margin:8px 0 6px;line-height:1.1;font-weight:800}
.winbox p{margin:0 0 14px;font-size:1.2rem;line-height:1.4}
.flashbox{border-top-color:var(--lucky)}
.flashbox .big{font-size:3.4rem;line-height:1}
.flashbox .ftext{font-size:1.4rem;line-height:1.45;margin:6px 0 14px;font-weight:600}
.flashbox .fans{font-size:1.45rem;font-weight:700;background:var(--sky2);border:4px solid var(--edge);padding:8px 10px;margin:0 0 14px}
.flashbox .who{font-size:1.05rem;color:var(--ink-soft);margin:-8px 0 14px}
.btn{font-size:1.3rem;padding:8px 18px;margin:4px;--bg:var(--good);--fg:#fff}
.btn.alt{--bg:var(--sky2);--fg:var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.pop{position:fixed;left:50%;top:38%;z-index:16;pointer-events:none;font-family:"Pixelify Sans","Nunito",sans-serif;font-size:clamp(3rem,12vw,6rem);color:#fff;
  text-shadow:0 4px 0 #172033,4px 0 0 #172033,-4px 0 0 #172033,0 -4px 0 #172033,6px 8px 0 rgba(0,0,0,.25);animation:popT 1s ease-out forwards}
@keyframes popT{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.ver{display:inline-block;margin-top:8px;font-size:.9rem;font-weight:700;background:var(--panel);border:3px solid var(--edge);padding:0 8px}
:root:fullscreen{overflow-y:auto;background:var(--sky)}:root:-webkit-full-screen{overflow-y:auto;background:var(--sky)}::backdrop{background:var(--sky)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="cloud" style="top:70px;left:6%"></div>
<div class="cloud" style="top:130px;right:14%"></div>
<div class="cloud" style="top:40px;left:58%;transform:scale(.7)"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="setup" class="wrap">
  <div class="title"><h1 id="tTitle"></h1><div class="ver">v1.2</div><p id="tSub"></p></div>
  <div class="settings" id="settings"></div>
  <div class="count" id="count" role="group"></div>
  <div class="players" id="players"></div>
  <button class="pbtn start" id="startBtn"></button>
</main>

<main id="game" class="wrap hidden">
  <div class="topbar">
    <button class="pbtn icon" id="backBtn"></button>
    <div class="turn px" id="turnLabel"></div>
    <div class="grp2"><button class="pbtn icon" id="fsBtn">⛶</button><button class="pbtn icon" id="fxBtn"></button><button class="pbtn icon" id="soundBtn"></button></div>
  </div>
  <div class="field" id="field"></div>
  <section class="qcard px" id="qcard">
    <div class="badge" id="badge"></div>
    <div class="qlabel" id="qlabel"></div>
    <div class="eq" id="eq"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>
</main>

<div class="overlay hidden" id="overlay">
  <div class="winbox px" id="winbox">
    <div class="avatars" id="winAv"></div>
    <h2 id="winTitle"></h2><p id="winText"></p>
    <button class="pbtn btn" id="againBtn"></button>
    <button class="pbtn btn alt" id="newBtn"></button>
  </div>
</div>
<div class="overlay hidden" id="flash">
  <div class="flashbox px" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <div class="big" id="fIcon"></div>
    <h2 id="fTitle"></h2>
    <div class="ftext" id="fText"></div>
    <div class="who hidden" id="fWho"></div>
    <div class="fans hidden" id="fAns"></div>
    <button class="pbtn btn" id="fShow"></button>
    <button class="pbtn btn" id="fCont"></button>
  </div>
</div>

<script>
/* ================= PURE PART (no DOM) ================= */
const GOAL=8, ADULT=11, PRO=12, ULTRA=13;
let LANG='en', LV=0;
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[r(0,a.length-1)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const picks=(arr,k)=>shuffle([...arr]).slice(0,k);
const tr=(en,pl,es)=>LANG==='pl'?pl:LANG==='es'?es:en;
function grp3(n){const s=String(Math.abs(n));return Math.abs(n)>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009'):s}
const fmt=n=>(n<0?'−':'')+grp3(n);
const par=n=>n<0?'('+fmt(n)+')':fmt(n);
const sgn=n=>n<0?`− ${-n}`:`+ ${n}`;
const nz=(a,b)=>{let v=0;while(v===0)v=r(a,b);return v};
const dec=x=>{let s=String(+(+x).toFixed(3));if(LANG!=='en')s=s.replace('.',',');return s.replace('-','−')};
const DIV=()=>LANG==='pl'?':':'÷';
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const tm=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const frs=(a,b)=>{const g=gcd(a,b)||1;a/=g;b/=g;return b===1?String(a):fr(a,b)};
function roman(n){const m=[[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,t]of m)while(n>=v){s+=t;n-=v}return s}
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const C2=(n,k)=>{let v=1;for(let i=0;i<k;i++)v=v*(n-i)/(i+1);return Math.round(v)};

const ANIM=['🐸','🐞','🐟','🐥','🐢','🦊','🐝','🐙','🦖','🐧','🦋','🐌','🐰','🐼','🦉','🐨'];
const FOOD=['🍎','🍌','🍓','🍪','🍩','🧁','🍉','🥕','🍒','🍋','🍇','🥨','🍐','🌽'];
const VEH=['🚗','🚕','🚌','🚲','✈️','🚀','🚂','🚁','⛵','🚜','🛵','🚒'];
const THING=['⭐','🎈','⚽','🪁','💎','🍄','🌸','🎁','🔔','🧩'];
const ALL=[...ANIM,...FOOD,...THING];

const DAYS={en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],pl:['poniedziałek','wtorek','środa','czwartek','piątek','sobota','niedziela'],es:['lunes','martes','miércoles','jueves','viernes','sábado','domingo']};
const MONTHS={en:['January','February','March','April','May','June','July','August','September','October','November','December'],pl:['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'],es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']};
const ORD={en:['first','second','third','fourth','fifth'],pl:['pierwszy','drugi','trzeci','czwarty','piąty'],es:['primero','segundo','tercero','cuarto','quinto']};
const SHAPES=()=>[[tr('circle','koło','círculo'),'🔴'],[tr('triangle','trójkąt','triángulo'),'🔺'],[tr('square','kwadrat','cuadrado'),'🟦'],[tr('star','gwiazda','estrella'),'⭐'],[tr('heart','serce','corazón'),'💜']];

const rows=(e,n,per=5)=>{let s='';for(let i=0;i<n;i++){s+=e;if((i+1)%per===0&&i<n-1)s+='<br>'}return `<span class="grp">${s}</span>`};

/* ---------- drawings ---------- */
const PIP={tl:[16,16],tr:[44,16],ml:[16,30],mr:[44,30],bl:[16,44],br:[44,44],c:[30,30]};
const PIPS={0:[],1:['c'],2:['tl','br'],3:['tl','c','br'],4:['tl','tr','bl','br'],5:['tl','tr','c','bl','br'],6:['tl','tr','ml','mr','bl','br']};
function die(n){return `<svg class="ill die" viewBox="0 0 60 60" role="img" aria-label="${n}"><rect x="3" y="3" width="54" height="54" rx="10" style="fill:#fff;stroke:#172033;stroke-width:4"/>${PIPS[n].map(k=>`<circle cx="${PIP[k][0]}" cy="${PIP[k][1]}" r="5.5" style="fill:#172033"/>`).join('')}</svg>`}
function domino(a,b){const half=(n,ox)=>PIPS[n].map(k=>`<circle cx="${ox+PIP[k][0]}" cy="${PIP[k][1]+2}" r="5" style="fill:#172033"/>`).join('');
  return `<svg class="ill die" viewBox="0 0 124 64" role="img" aria-label="domino"><rect x="3" y="3" width="118" height="58" rx="9" style="fill:#fff;stroke:#172033;stroke-width:4"/><line x1="62" y1="8" x2="62" y2="56" style="stroke:#172033;stroke-width:3"/>${half(a,1)}${half(b,63)}</svg>`}

  let s=`<svg class="ill" viewBox="0 0 100 100" role="img" aria-label="clock"><circle cx="50" cy="50" r="46" style="fill:#fff;stroke:#172033;stroke-width:4"/>`;
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=`<text x="${50+36*Math.sin(a)}" y="${50-36*Math.cos(a)+5}" text-anchor="middle" style="font-size:13px;fill:#172033">${i}</text>`}
  s+=`<line x1="50" y1="50" x2="${50+22*Math.sin(ha)}" y2="${50-22*Math.cos(ha)}" style="stroke:#D9403A;stroke-width:6;stroke-linecap:round"/><line x1="50" y1="50" x2="${50+33*Math.sin(ma)}" y2="${50-33*Math.cos(ma)}" style="stroke:#172033;stroke-width:3.5;stroke-linecap:round"/>`;

function choices(ans,trap,min=0,neg=false){
  const n=LV<=2?3:4,set=new Set([ans]),allowNeg=neg||ans<0;
  const offs=LV<=4?[1,-1,2,-2,3]:LV>=ADULT?[10,-10,1,-1,2,-2,20,-20]:[1,-1,2,-2,10,-10,5,-5];
  const c=[];if(trap!=null)c.push(trap);
  if(Math.abs(ans)>40&&LV<ADULT){const p=Math.round(ans*.1);c.push(ans+p,ans-p)}
  shuffle(offs).forEach(o=>c.push(ans+o));
  for(const v of c){if(set.size>=n)break;if(!Number.isInteger(v)||(!allowNeg&&v<min))continue;set.add(v)}
  let g=0;while(set.size<n&&g++<300){const v=ans+r(-12,12);if(allowNeg||v>=min)set.add(v)}
  return shuffle([...set]);
}

function tally(n){let s='',x=14;const g=Math.floor(n/5),rem=n%5,W=g*64+rem*14+28,ln=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c};stroke-width:4.5;stroke-linecap:round"/>`;
  for(let i=0;i<g;i++){for(let j=0;j<4;j++)s+=ln(x+j*12,10,x+j*12,62,'var(--ink)');s+=ln(x-7,54,x+43,18,'#D9403A');x+=64}
  for(let j=0;j<rem;j++)s+=ln(x+j*12,10,x+j*12,62,'var(--ink)');
  return `<svg class="ill die" viewBox="0 0 ${W} 72" role="img" aria-label="tally marks">${s}</svg>`}
function clockSm(h,m){const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;let s=`<svg class="ill" viewBox="0 0 100 100" role="img" aria-label="clock"><circle cx="50" cy="50" r="45" style="fill:#fff;stroke:#172033;stroke-width:5"/>`;
  for(let i=0;i<12;i++){if(i%3===0)continue;const a=i*30*Math.PI/180;s+=`<line x1="${50+40*Math.sin(a)}" y1="${50-40*Math.cos(a)}" x2="${50+34*Math.sin(a)}" y2="${50-34*Math.cos(a)}" style="stroke:#172033;stroke-width:3"/>`}
  [[12,0],[3,90],[6,180],[9,270]].forEach(([t,d])=>{const a=d*Math.PI/180;s+=`<text x="${50+33*Math.sin(a)}" y="${50-33*Math.cos(a)+6}" text-anchor="middle" style="font-size:17px;fill:#172033">${t}</text>`});
  s+=`<line x1="50" y1="50" x2="${50+20*Math.sin(ha)}" y2="${50-20*Math.cos(ha)}" style="stroke:#D9403A;stroke-width:7;stroke-linecap:round"/><line x1="50" y1="50" x2="${50+32*Math.sin(ma)}" y2="${50-32*Math.cos(ma)}" style="stroke:#172033;stroke-width:4;stroke-linecap:round"/>`;
  return s+'<circle cx="50" cy="50" r="4.5" style="fill:#172033"/></svg>'}
function thermo(t,st){const y=v=>170-v*3.5;let s=`<svg class="ill big" viewBox="0 0 110 205" role="img" aria-label="thermometer"><rect x="40" y="16" width="22" height="166" rx="11" style="fill:#fff;stroke:#172033;stroke-width:4"/><circle cx="51" cy="184" r="16" style="fill:#E53935;stroke:#172033;stroke-width:4"/><rect x="45" y="${y(t)}" width="12" height="${184-y(t)}" style="fill:#E53935"/>`;
  for(let v=0;v<=40;v+=st){const big=v%10===0;s+=`<line x1="62" y1="${y(v)}" x2="${big?78:71}" y2="${y(v)}" style="stroke:var(--ink);stroke-width:${big?3:2}"/>`;if(big)s+=`<text x="82" y="${y(v)+6}" style="font-size:16px;fill:var(--ink)">${v}</text>`}
  return s+'</svg>'}
function bars(nm,v,M){const y=k=>140-k*(120/M);let s=`<svg class="ill big" viewBox="0 0 264 172" role="img" aria-label="bar chart">`;
  for(let k=0;k<=M;k++){s+=`<line x1="36" y1="${y(k)}" x2="258" y2="${y(k)}" style="stroke:var(--ink);stroke-opacity:${k?0.2:0.9};stroke-width:${k?1.5:3}"/>`;if(k%2===0)s+=`<text x="28" y="${y(k)+5}" text-anchor="end" style="font-size:15px;fill:var(--ink)">${k}</text>`}
  const C=['#E53935','#1E88E5','#43A047'];v.forEach((k,i)=>{const x=54+i*72;s+=`<rect x="${x}" y="${y(k)}" width="44" height="${140-y(k)}" style="fill:${C[i]};stroke:#172033;stroke-width:2.5"/><text x="${x+22}" y="162" text-anchor="middle" style="font-size:16px;fill:var(--ink)">${nm[i]}</text>`});return s+'</svg>'}
function gridPic(x,y,e){const X=v=>34+v*30,Y=v=>160-v*30;let s=`<svg class="ill big" viewBox="0 0 196 190" role="img" aria-label="grid">`;
  for(let i=0;i<=5;i++){s+=`<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(5)}" style="stroke:var(--ink);stroke-opacity:.28;stroke-width:1.5"/><line x1="${X(0)}" y1="${Y(i)}" x2="${X(5)}" y2="${Y(i)}" style="stroke:var(--ink);stroke-opacity:.28;stroke-width:1.5"/><text x="${X(i)}" y="182" text-anchor="middle" style="font-size:16px;fill:var(--ink)">${i}</text>`;if(i)s+=`<text x="18" y="${Y(i)+6}" text-anchor="middle" style="font-size:16px;fill:var(--ink)">${i}</text>`}
  s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(5)+8}" y2="${Y(0)}" style="stroke:var(--ink);stroke-width:3"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(5)-8}" style="stroke:var(--ink);stroke-width:3"/><text x="${X(5)+6}" y="${Y(0)-8}" style="font-size:13px;fill:var(--ink)">x</text><text x="${X(0)+8}" y="${Y(5)-4}" style="font-size:13px;fill:var(--ink)">y</text>`;
  return s+`<text x="${X(x)}" y="${Y(y)+9}" text-anchor="middle" style="font-size:26px">${e}</text></svg>`}
function numLine(a,b){const X=v=>20+v*30;let s=`<svg class="ill" viewBox="0 0 340 92" role="img" aria-label="number line"><line x1="8" y1="60" x2="332" y2="60" style="stroke:var(--ink);stroke-width:3"/>`;
  for(let v=0;v<=10;v++)s+=`<line x1="${X(v)}" y1="52" x2="${X(v)}" y2="68" style="stroke:var(--ink);stroke-width:3"/><text x="${X(v)}" y="87" text-anchor="middle" style="font-size:15px;fill:var(--ink)">${v}</text>`;
  return s+`<text x="${X(a)}" y="42" text-anchor="middle" style="font-size:28px">🐸</text><text x="${X(b)}" y="42" text-anchor="middle" style="font-size:28px">🏁</text></svg>`}

function gen(l,p){const pool=TY.map((t,i)=>i).filter(i=>l>=TY[i].a&&l<=TY[i].b),rec=S.recent[p]||[];let c=pool.filter(i=>!rec.includes(i));if(!c.length)c=pool;
  const i=pick(c);rec.push(i);while(rec.length>Math.min(10,pool.length-1))rec.shift();S.recent[p]=rec;LV=l;return TY[i].f(l)}

/* pixel art */
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function texture(m,seed){const cv=document.createElement('canvas');cv.width=cv.height=8;const x=cv.getContext('2d'),rnd=mulberry(seed);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){const v=rnd();x.fillStyle=v<.18?m.d:v<.32?m.l:m.base;x.fillRect(i,j,1,1)}x.fillStyle='#fff';x.fillRect(2,2,1,1);x.fillRect(5,5,1,1);return cv.toDataURL()}
const MINER=["..hhhhhh..",".hhhLLhhh.",".HHHHHHHH.","..ssssss..","..sesses..","..ssmmss..",".bbbbbbbb.","sbbbbbbbbs","s.bbbbbb.s","..pppppp..","..pp..pp..","..kk..kk..",".kkk..kkk."];
function minerSVG(i){const m=MAT[i],col={h:m.base,H:m.d,L:'#FFE35C',s:'#F1C58F',e:'#172033',m:'#9A5B3C',b:m.d,p:'#34425F',k:'#2A2626'};
  let o=`<svg viewBox="0 0 10 13" shape-rendering="crispEdges" aria-hidden="true">`;MINER.forEach((row,y)=>[...row].forEach((ch,x)=>{if(col[ch])o+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${col[ch]}"/>`}));return o+'</svg>'}

/* sound */
let actx=null;
function tone(freqs,dur=.1,type='square'){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*dur;o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.07,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur*1.3);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur*1.4)})}catch(e){}}

/* effects */
const FX={c:$('fx'),x:null,p:[],on:false};FX.x=FX.c.getContext('2d');
function fxSize(){const d=window.devicePixelRatio||1;FX.c.width=innerWidth*d;FX.c.height=innerHeight*d;FX.x.setTransform(d,0,0,d,0,0)}
fxSize();addEventListener('resize',fxSize);
const PALETTE=['#D9403A','#8A5CE0','#E0A416','#2F7FD8','#23994A','#1FC8D0','#FF7AB6'];
function fxLoop(){const x=FX.x;x.clearRect(0,0,innerWidth,innerHeight);
  FX.p=FX.p.filter(p=>{if(p.delay>0){p.delay--;return true}p.life--;p.vy+=p.g;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;const a=Math.max(0,Math.min(1,p.life/30));x.globalAlpha=a;
    if(p.t==='ring'){p.size+=p.grow;x.strokeStyle=p.color;x.lineWidth=5;x.beginPath();x.arc(p.x,p.y,p.size,0,7);x.stroke()}
    else if(p.t==='txt'){x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.font=`${p.size}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(p.txt,0,0);x.restore()}
    else if(p.t==='dot'){x.fillStyle=p.color;x.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}
    else{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.color;x.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);x.restore()}
    return p.life>0&&p.y<innerHeight+80});
  x.globalAlpha=1;if(FX.p.length)requestAnimationFrame(fxLoop);else FX.on=false}
function spawn(o){FX.p.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,drag:1,rot:0,vr:0,life:80,size:10,color:pick(PALETTE),t:'rect',delay:0,grow:0},o));if(!FX.on){FX.on=true;requestAnimationFrame(fxLoop)}}
const E={
  confetti(x,y){for(let i=0;i<80;i++)spawn({x,y,vx:(Math.random()-.5)*16,vy:-Math.random()*13-3,g:.38,drag:.99,vr:(Math.random()-.5)*.4,size:8+Math.random()*8,life:90+r(0,30)})},
  fireworks(){for(let b=0;b<4;b++){const cx=innerWidth*(.15+Math.random()*.7),cy=innerHeight*(.15+Math.random()*.35),col=pick(PALETTE);
    for(let i=0;i<46;i++){const a=i/46*Math.PI*2,s=3+Math.random()*4;spawn({t:'dot',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.06,drag:.975,size:5,color:col,life:70,delay:b*12})}}},
  rain(gl){for(let i=0;i<34;i++)spawn({t:'txt',txt:pick(gl),x:Math.random()*innerWidth,y:-40-Math.random()*200,vy:3+Math.random()*3,g:.06,vr:(Math.random()-.5)*.05,size:28+Math.random()*18,life:170})},
  ring(x,y){for(let i=0;i<3;i++)spawn({t:'ring',x,y,size:10,grow:6+i*2,life:40,delay:i*6,color:pick(PALETTE)});for(let i=0;i<24;i++){const a=Math.random()*7,s=4+Math.random()*6;spawn({t:'txt',txt:'⭐',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,drag:.95,size:22,life:50})}},
  rise(x,y){for(let i=0;i<30;i++)spawn({t:'txt',txt:pick(['✨','⭐','💎','🧱']),x:x+(Math.random()-.5)*120,y,vy:-3-Math.random()*5,vx:(Math.random()-.5)*2,size:20+Math.random()*16,life:70+r(0,30)})}

function popText(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1050)}
function celebrate(btn,lucky,streak){if(!S.fx||RM)return;const b=btn.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
  const gl=(S.q.html+S.q.label).match(/\p{Extended_Pictographic}/gu)||['⭐','🧱','💎'];
  if(lucky){E.fireworks();E.rain(['💎','✨','🧱','⭐']);popText('+2 ✨');return}
  pick([()=>E.confetti(x,y),()=>E.ring(x,y),()=>E.rain(gl.slice(0,4)),()=>E.rise(x,y),()=>{E.confetti(x,y);E.ring(x,y)}])();
  if(streak>=3){E.fireworks();popText(`🔥 ×${streak}`)}else if(Math.random()<.5)popText(pick(U().pops))}

  if(d){if(d.n>=1&&d.n<=4)S.n=d.n;if(UI[d.lang])LANG=d.lang;if(Array.isArray(d.p))d.p.forEach((p,i)=>{if(!S.players[i]||!p)return;if(typeof p.name==='string')S.players[i].name=p.name.slice(0,14);if(p.lvl>=0&&p.lvl<=ULTRA)S.players[i].lvl=p.lvl});
    if(typeof d.sound==='boolean')S.sound=d.sound;if(typeof d.fx==='boolean')S.fx=d.fx;if(typeof d.fun==='boolean')S.fun=d.fun;if(d.wins)S.wins=d.wins;if(d.best)S.best=d.best}
  else{const nl=(navigator.language||'en').slice(0,2);LANG=UI[nl]?nl:'en'}}catch(e){}}

  const ru=document.createElement('div');ru.className='ruler';ru.setAttribute('aria-hidden','true');for(let i=1;i<=GOAL;i++){const d=document.createElement('div');d.textContent=i===GOAL?'🏁':i;ru.appendChild(d)}f.appendChild(ru);

    const t=col.querySelector('.tower');for(let i=0;i<GOAL;i++){const b=document.createElement('div');b.className='block';b.style.setProperty('--tex',`url(${texture(m,p*100+i)})`);t.appendChild(b)}f.appendChild(col)}}
function renderTower(p,added){const pl=S.players[p];
  $('tower'+p).querySelectorAll('.block').forEach((b,i)=>{b.classList.toggle('on',i<pl.steps);if(added&&i>=pl.steps-added&&i<pl.steps){b.classList.remove('drop');void b.offsetWidth;b.classList.add('drop')}});
  const mn=$('miner'+p);mn.style.setProperty('--s',pl.steps);if(added){mn.classList.remove('hop');void mn.offsetWidth;mn.classList.add('hop')}
  $('score'+p).textContent=`${pl.steps}/${GOAL} · ${lvlLabel(pl.lvl)}`}

/* flow */
function startGame(){for(let i=0;i<S.n;i++){const p=S.players[i];p.steps=0;p.streak=0;p.asked=0}
  S.turn=0;S.endRound=false;S.busy=false;S.answered=0;save();
  $('setup').classList.add('hidden');$('game').classList.remove('hidden');$('overlay').classList.add('hidden');
  $('backBtn').textContent=U().back;buildField();for(let p=0;p<S.n;p++)renderTower(p);icons();nextQuestion()}
function nextQuestion(msg){const p=S.turn,pl=S.players[p];S.q=gen(pl.lvl,p);pl.asked++;S.busy=false;
  S.q.lucky=!S.endRound&&pl.steps<GOAL-1&&Math.random()<.12;const card=$('qcard');setPV(card,p);setPV($('turnLabel'),p);card.classList.toggle('lucky',S.q.lucky);
  $('turnLabel').textContent=S.n===1?U().solo(nameOf(p)):U().turn(nameOf(p));for(let i=0;i<S.n;i++)$('col'+i).classList.toggle('idle',S.n>1&&i!==p);
  $('badge').textContent=msg||(S.q.lucky?U().lucky:'');$('qlabel').textContent=S.q.label;$('eq').innerHTML=S.q.html;$('eq').classList.toggle('hidden',!S.q.html);$('feedback').textContent='';
  const box=$('answers');box.style.setProperty('--k',S.q.opts.length);box.innerHTML='';
  S.q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='pbtn ans'+(S.q.cls?' '+S.q.cls:'');b.innerHTML=o.h;b.dataset.v=o.v;b.onclick=()=>answer(b,o.v);box.appendChild(b)})}
function answer(btn,v){if(S.busy)return;S.busy=true;const p=S.turn,pl=S.players[p],ok=v===S.q.ans;S.answered++;
  if(ok){btn.classList.add('right');const gain=Math.min(S.q.lucky?2:1,GOAL-pl.steps);pl.steps+=gain;pl.streak++;renderTower(p,gain);
    $('feedback').textContent=(S.q.lucky?U().luckyGood:pick(U().good))+(pl.streak>=3?U().streak(pl.streak):'');
    S.q.lucky?tone([523,659,784,1047,1319],.08):tone([392,523,659],.08);celebrate(btn,S.q.lucky,pl.streak)}
  else{pl.streak=0;btn.classList.add('wrong');let right='';document.querySelectorAll('.ans').forEach(b=>{if(b.dataset.v===S.q.ans){b.classList.add('right');right=b.querySelector('svg')?'':b.innerHTML}});
    $('feedback').innerHTML=right?U().wrong(right):U().wrongPic;tone([196,147],.14)}
  setTimeout(()=>afterAnswer(p),ok?1200:2200)}
function afterAnswer(p){const P=S.players.slice(0,S.n);let next;
  if(S.n===1){if(P[0].steps>=GOAL)return finish([0]);next=()=>nextQuestion()}
  else{if(!S.endRound&&P[p].steps>=GOAL)S.endRound=true;
    if(S.endRound){const top=P.map((x,i)=>i).filter(i=>P[i].steps>=GOAL);let q=-1;for(let j=p+1;j<S.n;j++)if(P[j].steps===GOAL-1){q=j;break}
      if(q<0)return finish(top);S.turn=q;next=()=>nextQuestion(U().last(top.map(i=>nameOf(i)).join(U().and),nameOf(q)))}
    else{S.turn=(p+1)%S.n;next=()=>nextQuestion()}}
  if(S.fun&&S.answered%3===0)showFlash(next);else next()}
const BAGS={};
function draw(cat){const k=cat+LANG;if(!BAGS[k]||!BAGS[k].length)BAGS[k]=shuffle(FUN[cat].filter(x=>x[LANG]));return BAGS[k].pop()}
function showFlash(done){const f=$('flash'),cats=['pun','silly','fact'].filter(c=>c!==S.lastCat||Math.random()<.25),cat=pick(cats);S.lastCat=cat;
  const item=draw(cat),c=item[LANG],qa=cat!=='fact',quote=cat==='fact'&&item.q,tw=item.tw;
  $('fIcon').textContent=tw?'👅':cat==='pun'?'😜':cat==='silly'?'🤪':quote?'💬':'💡';
  $('fTitle').textContent=tw?U().tw:cat==='pun'?U().joke:cat==='silly'?U().silly:quote?U().quote:U().did;
  $('fText').textContent=qa||quote?c[0]:c;$('fWho').textContent=quote?'— '+c[1]:'';$('fWho').classList.toggle('hidden',!quote);
  $('fAns').textContent=qa?c[1]:'';$('fAns').classList.add('hidden');$('fShow').textContent=tw?U().cont:U().show;$('fShow').classList.toggle('hidden',!qa);$('fCont').textContent=U().cont;$('fCont').classList.toggle('hidden',qa);
  $('fShow').onclick=()=>{$('fAns').classList.remove('hidden');$('fShow').classList.add('hidden');$('fCont').classList.remove('hidden');$('fCont').focus();tone([330,262,392],.09,'triangle');if(S.fx&&!RM)E.rain(tw?['👅','🌀','😵']:['😂','🤣','😆'])};
  $('fCont').onclick=()=>{f.classList.add('hidden');done()};f.classList.remove('hidden');(qa?$('fShow'):$('fCont')).focus();tone([660,880],.08,'triangle')}
function finish(winners){S.busy=true;const P=S.players.slice(0,S.n),wb=$('winbox');
  if(S.n===1){const nm=nameOf(0),k=key(nm)+'|'+P[0].lvl,q=P[0].asked;S.best[k]=Math.min(S.best[k]||Infinity,q);setPV(wb,0);$('winTitle').textContent=U().soloTitle;$('winText').textContent=U().soloText(q,S.best[k])}
  else{winners.forEach(i=>{const k=key(nameOf(i));S.wins[k]=(S.wins[k]||0)+1});
    if(winners.length>1){wb.style.setProperty('--pc','var(--good)');$('winTitle').textContent=U().tie;$('winText').textContent=U().tieText(winners.map(i=>nameOf(i)).join(U().and))}
    else{const w=winners[0];setPV(wb,w);$('winTitle').textContent=U().win(nameOf(w));$('winText').textContent=U().winText(S.wins[key(nameOf(w))],P.map((x,i)=>i).filter(i=>i!==w).map(i=>U().built(nameOf(i),P[i].steps)).join(' '))}}
  save();$('winAv').innerHTML=winners.map(minerSVG).join('');$('againBtn').textContent=U().again;$('newBtn').textContent=U().menu;
  for(let i=0;i<S.n;i++){$('col'+i).classList.remove('idle');$('col'+i).classList.toggle('won',winners.includes(i))}
  $('overlay').classList.remove('hidden');tone([523,659,784,1047,784,1047],.11);if(S.fx&&!RM){E.fireworks();setTimeout(E.fireworks,700);E.rain(['🏆','⭐','🧱','💎'])}$('againBtn').focus()}

function toSetup(){$('overlay').classList.add('hidden');$('flash').classList.add('hidden');$('game').classList.add('hidden');$('setup').classList.remove('hidden');buildSetup()}
$('startBtn').onclick=startGame;$('againBtn').onclick=startGame;$('newBtn').onclick=toSetup;$('backBtn').onclick=toSetup;
$('soundBtn').onclick=()=>{S.sound=!S.sound;icons();save()};$('fxBtn').onclick=()=>{S.fx=!S.fx;icons();save()};$('fsBtn').onclick=toggleFS;fsUpdate();
document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden')||S.busy||!$('flash').classList.contains('hidden'))return;
  const i=parseInt(e.key,10),btns=document.querySelectorAll('.ans');if(i>=1&&i<=btns.length)btns[i-1].click()});
load();buildSetup();
}
</script>
